name: playground

on:
  push:
    branches: [main]
    paths:
      - "apps/playground/**"
      - "packages/**"
      - "config/**"
      - ".github/workflows/playground.yml"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.9.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Build
        run: pnpm --filter @inletkit/sdk build && pnpm --filter @inletkit/widget build && pnpm --filter @inletkit/playground build
        env:
          NEXT_PUBLIC_PRIVY_APP_ID: cmtnbkuss000f0cl17mc9ac2n
          NEXT_PUBLIC_RELAYER_URL: https://inlet-relayer.wonderfulforest-6c3e22a4.westeurope.azurecontainerapps.io
      - name: Upload
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: upload
          app_location: apps/playground/out
          skip_app_build: true
          skip_api_build: true
